[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pangu-memory"
version = "0.1.0"
description = "A local, explainable, forgettable long-term memory layer for LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tai-Lynx" }]
keywords = ["llm", "memory", "agent", "rag", "sqlite", "conflict-resolution"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tai-Lynx/pangu-memory"
Issues = "https://github.com/tai-Lynx/pangu-memory/issues"

[tool.setuptools.packages.find]
include = ["pangu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
